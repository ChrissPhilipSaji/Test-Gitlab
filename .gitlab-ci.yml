workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

stages: [build, review, cleanup]

build:
  stage: build
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  script:
    - mkdir -p public
    - cp -r app/. public/
    - echo "<p>built from $CI_COMMIT_REF_NAME at $CI_COMMIT_SHORT_SHA</p>" >> public/index.html
  artifacts:
    paths: [public/]

deploy_review:
  stage: review
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - echo "Deploying review app for $CI_COMMIT_REF_NAME"
    - echo "URL https://$CI_ENVIRONMENT_SLUG.review.example.test"
    - ls public
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: https://$CI_ENVIRONMENT_SLUG.review.example.test
    on_stop: stop_review
    auto_stop_in: 2 days

stop_review:
  stage: review
  image: alpine:3.20
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  script:
    - echo "Removing review app for $CI_COMMIT_REF_NAME"
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop

deploy_main:
  stage: review
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "Deploying main to the shared preview environment"
  environment:
    name: preview
    url: https://preview.review.example.test

cleanup-stale-environments:
  stage: cleanup
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - apk add --no-cache curl
  script:
    - |
      if [ -z "$CLEANUP_TOKEN" ] || [ "$CLEANUP_TOKEN" = "set-me" ]; then
        echo "Set CLEANUP_TOKEN (api scope) to stop stale environments"
        exit 0
      fi
      BEFORE=$(date -u -d "@$(( $(date +%s) - 172800 ))" +%Y-%m-%dT%H:%M:%SZ)
      curl --fail --request POST --header "PRIVATE-TOKEN: $CLEANUP_TOKEN" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/environments/stop_stale?before=$BEFORE"
