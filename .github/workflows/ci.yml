name: "EO-81096 - dynamic pipeline pass, run 2 (validators fixed)"

on:
  workflow_dispatch:
    inputs:
      GENERATE_DEPLOY:
        type: string
        default: 'true'
  pull_request:

permissions:
  contents: read

env:
  GENERATE_DEPLOY: 'true'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      c0: ${{ steps.diff.outputs.c0 }}
      c1: ${{ steps.diff.outputs.c1 }}
      c2: ${{ steps.diff.outputs.c2 }}
      c3: ${{ steps.diff.outputs.c3 }}
      c4: ${{ steps.diff.outputs.c4 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PATTERNS: '{"c0": ["services/svc-a/**/*", "libs/shared/**/*"], "c1": ["services/svc-b/**/*", "libs/shared/**/*"], "c2": ["services/svc-c/**/*"], "c3": ["services/**/*", "libs/**/*"], "c4": ["libs/shared/**/*"]}'
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess

          def rx(p):
              out, i = "", 0
              while i < len(p):
                  if p.startswith("**/", i):
                      out, i = out + "(?:.*/)?", i + 3
                  elif p.startswith("**", i):
                      out, i = out + ".*", i + 2
                  elif p[i] == "*":
                      out, i = out + "[^/]*", i + 1
                  elif p[i] == "?":
                      out, i = out + "[^/]", i + 1
                  else:
                      out, i = out + re.escape(p[i]), i + 1
              return re.compile("^" + out + "$")

          base = os.environ.get("BASE_SHA", "")
          changed = None
          if base and set(base) != {"0"}:
              done = subprocess.run(["git", "diff", "--name-only", base, "HEAD"], capture_output=True, text=True)
              if done.returncode == 0:
                  changed = done.stdout.splitlines()
          lines = []
          for key, patterns in json.loads(os.environ["PATTERNS"]).items():
              hit = changed is None or any(rx(p).match(f) for p in patterns for f in changed)
              lines.append(key + "=" + ("true" if hit else "false"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("\n".join(lines) + "\n")
          PY

  lint-shared:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.c4 == 'true' }}
    container:
      image: python:3.12-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Lint
        run: python3 -m py_compile libs/shared/shared.py

  shared-contract-check:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !failure() && (needs.detect-changes.outputs.c4 == 'true') }}
    container:
      image: python:3.12-alpine
    needs: [lint-shared, detect-changes]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Shared contract check
        run: echo "runs only when libs/shared changes"

  test-svc-a:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !failure() && (needs.detect-changes.outputs.c0 == 'true') }}
    container:
      image: python:3.12-alpine
    needs: [shared-contract-check, detect-changes]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Test svc-a
        run: python3 -m unittest discover -s services/svc-a

  test-svc-b:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !failure() && (needs.detect-changes.outputs.c1 == 'true') }}
    container:
      image: python:3.12-alpine
    needs: [shared-contract-check, detect-changes]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Test svc-b
        run: python3 -m unittest discover -s services/svc-b

  test-svc-c:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !failure() && (needs.detect-changes.outputs.c2 == 'true') }}
    container:
      image: python:3.12-alpine
    needs: [shared-contract-check, detect-changes]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Test svc-c
        run: python3 -m unittest discover -s services/svc-c

  build-svc-a:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !failure() && (needs.detect-changes.outputs.c0 == 'true') }}
    container:
      image: python:3.12-alpine
    needs: [test-svc-a, detect-changes]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build svc-a
        run: mkdir -p dist && echo svc-a > dist/svc-a.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-svc-a-artifacts
          path: |
            dist/
          if-no-files-found: warn

  build-svc-b:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !failure() && (needs.detect-changes.outputs.c1 == 'true') }}
    container:
      image: python:3.12-alpine
    needs: [test-svc-b, detect-changes]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build svc-b
        run: mkdir -p dist && echo svc-b > dist/svc-b.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-svc-b-artifacts
          path: |
            dist/
          if-no-files-found: warn

  build-svc-c:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !failure() && (needs.detect-changes.outputs.c2 == 'true') }}
    container:
      image: python:3.12-alpine
    needs: [test-svc-c, detect-changes]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build svc-c
        run: mkdir -p dist && echo svc-c > dist/svc-c.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-svc-c-artifacts
          path: |
            dist/
          if-no-files-found: warn

  integration:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !failure() && (needs.detect-changes.outputs.c3 == 'true') }}
    container:
      image: python:3.12-alpine
    needs:
      - build-svc-a
      - build-svc-b
      - build-svc-c
      - detect-changes
    steps:



      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download artifacts from build-svc-c
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: build-svc-c-artifacts
          path: dist
      - name: Download artifacts from build-svc-b
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: build-svc-b-artifacts
          path: dist
      - name: Download artifacts from build-svc-a
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: build-svc-a-artifacts
          path: dist
      - name: Integration
        run: |
          ls dist || echo "no artifacts"
          echo "integration runs when any component changed"

  generate-children:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && !failure() }}
    container:
      image: python:3.12-alpine
    needs: integration
    outputs:
      items: ${{ steps.items.outputs.items }}
      GENERATE_DEPLOY: ${{ steps.items.outputs.GENERATE_DEPLOY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download artifacts from build-svc-c
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: build-svc-c-artifacts
          path: dist
      - name: Download artifacts from build-svc-b
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: build-svc-b-artifacts
          path: dist
      - name: Download artifacts from build-svc-a
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: build-svc-a-artifacts
          path: dist
      - id: items
        run: |
          items=$(python3 - <<'PY'
          import json, os
          d = 'services'
          print(json.dumps(sorted(x for x in os.listdir(d) if os.path.isdir(os.path.join(d, x)))))
          PY
          )
          echo "items=$items" >> "$GITHUB_OUTPUT"
          echo "GENERATE_DEPLOY=${GENERATE_DEPLOY:-true}" >> "$GITHUB_OUTPUT"

  run-children:
    # Reusable workflow built from 'ci/generate.py' (read at analysis). GitHub cannot create jobs at runtime.
    needs: [generate-children]
    uses: ./.github/workflows/child.yml
    with:
      items: ${{ needs.generate-children.outputs.items }}
      GENERATE_DEPLOY: ${{ needs.generate-children.outputs.GENERATE_DEPLOY }}
