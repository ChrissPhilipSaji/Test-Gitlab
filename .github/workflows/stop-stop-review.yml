name: stop-stop_review

# on_stop: runs when the pull request closes. Deployments of the review environment are
# marked inactive; deleting the environment itself needs an administration token (manual).
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  deployments: write

jobs:
  stop_review:
    runs-on: ubuntu-latest
    steps:

      - name: Stop
        run: echo "Removing review app for $GITHUB_HEAD_REF"

  mark-inactive:
    needs: stop_review
    runs-on: ubuntu-latest
    steps:
      - name: Mark review deployments inactive
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENV_NAME: "review/${{ github.head_ref || github.ref_name }}"
        run: |
          enc=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["ENV_NAME"],safe=""))')
          for id in $(gh api "repos/$REPO/deployments?environment=$enc" --jq '.[].id'); do
            gh api -X POST "repos/$REPO/deployments/$id/statuses" -f state=inactive > /dev/null
          done
